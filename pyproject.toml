[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "flm-test"
version = "0.1.1"
description = "A comprehensive testing framework for FastFlowLM that validates the functionality of various AI model categories including Language, Embedding, Audio, and Vision models."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
keywords = ["flm", "fastflowlm", "q4nx", "npu", "model-testing"]
classifiers = [
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Build Tools"
]
dependencies = [
    "annotated-types==0.8.0",
    "anyio==4.14.2",
    "certifi==2026.7.22",
    "distro==1.9.0",
    "h11==0.16.0",
    "jiter==0.16.0",
    "openai==3.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
flm-test = "flm_test:main"

[tool.setuptools]
packages = ["flm_test"]
